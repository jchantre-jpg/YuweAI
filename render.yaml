# https://render.com/docs/blueprint-spec
version: "1"

# Render Blueprint: API YuweAI (Docker en la raíz del repo).
# Al crear / sincronizar el Blueprint, Render pedirá el valor de las variables con sync: false (no las pongas en Git).
#
# El plan "free" puede dormir el servicio; la BD persistente va en Supabase (DATABASE_URL).
# Render define la variable de entorno PORT; server.py la respeta (no fijar solo 8090 en producción).

services:
  - type: web
    name: yuweai-avi-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # GET devuelve JSON; algunos checks con HEAD / daban 501 en versiones sin do_HEAD.
    healthCheckPath: /api/health
    envVars:
      - key: AVI_CORS_ORIGINS
        value: https://yuwe-ai.web.app,https://yuwe-ai.firebaseapp.com
      - key: AVI_SKIP_DEMO_USERS
        value: "1"
      # Build + runtime: URL directa a .tar.gz con corpus/generadas-img-ia-solo (PNG + JSON).
      # Si el .tar.gz supera 2 GB (limite GitHub), usar SOLO_IMG_TARBALL_PARTS con URLs separadas por coma.
      - key: SOLO_IMG_TARBALL_PARTS
        value: https://github.com/jchantre-jpg/YuweAI/releases/download/solo-img-ia-v2/solo-img-ia.tar.gz.part001,https://github.com/jchantre-jpg/YuweAI/releases/download/solo-img-ia-v2/solo-img-ia.tar.gz.part002,https://github.com/jchantre-jpg/YuweAI/releases/download/solo-img-ia-v2/solo-img-ia.tar.gz.part003
      - key: SOLO_IMG_TARBALL_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Opcional: OAuth Google en el servidor (si lo usas, añade en el dashboard o descomenta con sync: false)
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
