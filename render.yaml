# https://render.com/docs/blueprint-spec
version: "1"

# Render Blueprint: API YuweAI (Docker en la raíz del repo).
# Al crear / sincronizar el Blueprint, Render pedirá el valor de las variables con sync: false (no las pongas en Git).
#
# El plan "free" puede dormir el servicio; la BD persistente va en Supabase (DATABASE_URL).
# Render define la variable de entorno PORT; server.py la respeta (no fijar solo 8090 en producción).

services:
  - type: web
    name: yuweai-avi-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # GET devuelve JSON; algunos checks con HEAD / daban 501 en versiones sin do_HEAD.
    healthCheckPath: /api/health
    envVars:
      - key: AVI_CORS_ORIGINS
        value: https://yuwe-ai.web.app,https://yuwe-ai.firebaseapp.com
      # "0" = crea alumnos panel (alumno.panel01…) y datos docente demo al arrancar / al sincronizar.
      - key: AVI_SKIP_DEMO_USERS
        value: "0"
      # PNG diccionario: stream al arrancar (NO usa /tmp). Plan free: no re-descarga 5 GB si ya hay ~2000+ PNG.
      - key: SOLO_IMG_TARBALL_URL
        value: https://huggingface.co/Juliana08/yuwe-solo-img-tarball/resolve/main/solo-img-ia.tar.gz
      - key: SOLO_IMG_DEFER_SECONDS
        value: "45"
      - key: SOLO_IMG_SKIP_REDOWLOAD
        value: "1"
      - key: SOLO_IMG_SKIP_IF_COUNT
        value: "2000"
      # CDN imagenes (Hugging Face = gratis sin tarjeta). Firebase Storage pide plan Blaze.
      - key: SOLO_IMG_CDN_BASE
        value: https://huggingface.co/datasets/Juliana08/yuwe-dict-images/resolve/main
      # Opcional Firebase (requiere tarjeta Blaze): descomenta y sube con SUBIR-IMAGENES-FIREBASE.bat
      # - key: FIREBASE_STORAGE_BUCKET
      #   value: yuwe-ai.firebasestorage.app
      # - key: FIREBASE_STORAGE_PREFIX
      #   value: corpus-img
      - key: DATABASE_URL
        sync: false
      # Opcional: OAuth Google en el servidor (si lo usas, añade en el dashboard o descomenta con sync: false)
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
